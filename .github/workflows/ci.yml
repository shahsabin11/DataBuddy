name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_USER: databuddy
          POSTGRES_PASSWORD: databuddy
          POSTGRES_DB: databuddy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U databuddy -d databuddy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff
        run: ruff check app tests scripts

      - name: Pytest
        env:
          DATABASE_URL: postgresql+psycopg://databuddy:databuddy@localhost:5432/databuddy
          DATABASE_APP_URL: postgresql+psycopg://databuddy_app:databuddy_app@localhost:5432/databuddy
          DATABASE_ADMIN_URL: postgresql+psycopg://databuddy_admin:databuddy_admin@localhost:5432/databuddy
          SESSION_SECRET: ci-test-session-secret-not-for-production
          ANTHROPIC_API_KEY: test-key
          E2B_API_KEY: test-key
          S3_ACCESS_KEY_ID: test
          S3_SECRET_ACCESS_KEY: test
          S3_BUCKET: databuddy
          ENVIRONMENT: local
        run: pytest -q

  web:
    name: Web lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test
